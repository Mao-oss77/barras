<!DOCTYPE html>
<html lang="es">

<!-- ===== CABEZA: configuración que NO se ve en la página ===== -->
<head>
  <!-- Permite tildes, ñ y signos como ¡ ¿ -->
  <meta charset="UTF-8">
  <!-- Hace que en el celular se vea a tamaño normal, no en miniatura -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Nombre que sale en la pestaña del navegador -->
  <title>Nivel de satisfacción</title>
  <!-- Conecta el archivo de estilos (colores, tamaños, posiciones) -->
  <link rel="stylesheet" href="estilos.css">
</head>

<!-- ===== CUERPO: todo lo que SÍ se ve en la página ===== -->
<body>
  <!-- Título grande de arriba -->
  <h1>Nivel de satisfacción</h1>

  <!-- Pestañas: cada botón muestra un grupo de barras -->
  <div id="pestanas">
    <button class="pestana activa" id="pestana-satisfaccion">Satisfacción</button>
    <button class="pestana" id="pestana-desarrollo">Desarrollo</button>
  </div>

  <!-- Panel: JavaScript mete las barras aquí, antes de la tarjeta de agregar -->
  <div id="panel">

    <!-- Tarjeta para agregar barras nuevas (siempre queda de última) -->
    <div class="necesidad tarjeta-agregar" id="tarjeta-agregar">
      <button class="barra-agregar" id="abrir-agregar" aria-label="Nueva barra">+</button>
      <p>Nueva barra</p>
      <div class="ajustes" id="caja-agregar" hidden>
        <small>Nombre de la barra:</small>
        <input type="text" id="nuevo-nombre" maxlength="20" placeholder="Ej: Cocinar">
        <small>Texto del botón:</small>
        <input type="text" id="nuevo-boton" maxlength="20" placeholder="Ej: Cociné">
        <button id="confirmar-agregar">Agregar</button>
      </div>
    </div>

  </div>

  <!-- Conecta JavaScript -->
  <script src="app.js"></script>
</body>
</html>
